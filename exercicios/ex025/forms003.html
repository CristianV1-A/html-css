<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Teste de formulário</h1>
<form action="cadastro.js" method="get" autocomplete="on">
    <p>
        <label for="idnome">Nome: </label>
        <input type="text" name="nome" id="idnome" required maxlength="30"
        placeholder="Digite seu nome Completo" autocomplete="name">    
    </p>
    <p>
        <label for="idmedia">Média: </label>
        <input type="number" name="media" id="idmedia" required placeholder="0 a 10" min="0" max="10" step="0.1">
    </p>
        <label for="iddiaprova">Dia da prova: </label>
        <input type="date" name="diaprova" id="iddiaprova" value="2025-11-18">
    <p>
        <label for="idmes">Período letivo: </label>
        <input type="month" name="mes" id="idmes" value="2025-11">
    </p>
       <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</form>
</body>
</html>
