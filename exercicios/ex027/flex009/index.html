<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.conteiner{
            display: flex;
            background-color: aquamarine;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: black;
            color: white;
            flex-basis: auto;
            
            
        }
    
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">Bobo da corte</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">Fodase porra caralho</div>
        <div class="item">Gosto de banana massada co faria</div>
        
    </div>
</body>
</html>
